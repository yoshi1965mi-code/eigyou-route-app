<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>営業ルート管理</title><style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:#203047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#174a76;color:white;padding:18px 20px}h1{font-size:1.35rem;margin:0}header small{opacity:.9}.wrap{max-width:1080px;margin:auto;padding:16px}.notice{background:#fff7e6;border-left:4px solid #d38a1e;padding:12px;border-radius:6px;margin-bottom:15px}.toolbar,.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,.btn,select,input{font:inherit;border-radius:8px;border:1px solid #b7c8d8;padding:10px;background:white}button{cursor:pointer}button.primary,.btn.primary{background:#1769a5;color:white;border-color:#1769a5}button:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button[aria-selected=true]{background:#174a76;color:white}.panel{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #12253b16}.item{border-bottom:1px solid #e2e7ed;padding:12px 0;display:flex;justify-content:space-between;align-items:start;gap:12px}.item:last-child{border:0}.muted{color:#617286;font-size:.9rem}.actions{display:flex;gap:6px;flex-wrap:wrap}input[type=search]{flex:1;min-width:190px}textarea{width:100%;min-height:75px;font:inherit;border:1px solid #b7c8d8;border-radius:8px;padding:8px}a{color:#1769a5}#file{max-width:100%}@media(max-width:600px){.item{display:block}.actions{margin-top:9px}.wrap{padding:10px}}
.visitor-controls{margin-top:9px;padding:9px;background:#f3f6fa;border-radius:8px}.visitor-controls>label{font-weight:600;font-size:.9rem}.visitor-checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:7px}.visitor-checks label{font-size:.9rem;white-space:nowrap;cursor:pointer}.visitor-checks input{width:17px;height:17px;vertical-align:middle}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.edit-grid label{display:flex;flex-direction:column;gap:4px;font-weight:600}.edit-grid input,.edit-grid select{width:100%}.manage-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:8px 0;flex-wrap:wrap}.visitor-controls select{max-width:100%;margin:5px 0 9px;display:block;min-width:200px}</style></head><body><header><h1>営業ルート管理</h1><small>青葉区・緑区・都筑区｜スマホ・パソコン対応</small></header><main class="wrap"><div class="notice"><b>情報保護：</b>営業先データはこのHTMLには含まれていません。Excelファイルは端末内で読み込みます。GitHubにはExcelファイルや書き出したJSONをアップロードしないでください。端末間の自動同期は未対応です。別々のスマホの履歴は共有されません。</div><section class="panel"><h2>① Excelデータの読み込み</h2><p class="muted">お手元の .xlsm / .xlsx を選択してください。初回読み込みにはインターネット接続が必要です。VBAマクロは実行しません。</p><input id="file" type="file" accept=".xlsx,.xlsm"><div class="toolbar"><button id="save" class="primary">端末に保存</button><button id="export">バックアップを出力</button><button id="import">バックアップを読み込む</button><input type="file" id="jsonFile" accept=".json" hidden></div><div id="status" class="muted" role="status">データ未読み込み</div></section><nav class="tabs" aria-label="画面切り替え"><button data-tab="list" aria-selected="true">営業先検索</button><button data-tab="today">本日の営業先</button><button data-tab="history">訪問履歴</button><button data-tab="summary">集計・設定</button></nav><section class="panel" id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
'use strict';
// 公開リポジトリに業務データを埋め込まない。読み込みはユーザーが選択したローカルファイルのみ。
const KEY='eigyou-route-local-v1', districts=['青葉区','緑区','都筑区'];
let db={places:[],history:[],staff:[],settings:{},today:[]},tab='list',district='すべて',query='',selectedStaff='';
const STAFF_KEY='eigyou-route-selected-visitor-v1';
// 営業先ごとの訪問者割当。todayStaff は端末内の保存データにのみ含める。
function assignments(){if(!db.todayStaff||typeof db.todayStaff!=='object'||Array.isArray(db.todayStaff))db.todayStaff={};return db.todayStaff}
function assigned(id){return (assignments()[id]||[]).filter(n=>db.staff.includes(n))}
function setAssigned(id, names){assignments()[id]=[...new Set(names.filter(n=>db.staff.includes(n)))];persist();render()}

try{selectedStaff=sessionStorage.getItem(STAFF_KEY)||''}catch(e){}
const $=id=>document.getElementById(id), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=(s)=>escapeHtml(s);const status=s=>$('status').textContent=s;
const get=(r,i)=>String(r?.[i]??'').trim();
function validDb(x){return x&&Array.isArray(x.places)&&Array.isArray(x.history)&&Array.isArray(x.today)&&Array.isArray(x.staff)&&x.settings&&typeof x.settings==='object'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));status('この端末のブラウザに保存しました（共有・暗号化はされません）')}catch(e){status('保存できません：端末の空き容量やブラウザ設定を確認してください')}}
function excelDate(v){if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:String(v)}return String(v??'')}
function parseBook(wb){const read=name=>wb.Sheets[name]?XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true}):[];const places=[];for(const area of districts){for(const r of read(area).slice(1)){if(!get(r,3))continue;const n=Number(get(r,0));places.push({id:`${area}-${Number.isFinite(n)?n:places.length+1}`,area,type:get(r,2),name:get(r,3),address:get(r,4),contact:get(r,5),phone:get(r,6),lat:parseFloat(get(r,7)),lng:parseFloat(get(r,8)),last:excelDate(r[9]),visits:Number(r[10])||0,memo:get(r,11),selected:/^[○〇◯✔✓1]$/.test(get(r,1))})}}
const staff=[...new Set(read('職員名簿').slice(1).map(r=>get(r,1)).filter(Boolean))];
const history=read('訪問履歴').slice(1).filter(r=>get(r,0)||get(r,3)).map(r=>({date:excelDate(r[0]),area:get(r,1),type:get(r,2),name:get(r,3),staff:get(r,4),count:get(r,5),memo:get(r,6),time:get(r,7)}));
const settings={};for(const r of read('設定').slice(1))if(get(r,0))settings[get(r,0)]=get(r,1);
const today=places.filter(p=>p.selected).map(p=>p.id);const chosen=read('本日の営業先').slice(1).map(r=>({area:get(r,1),name:get(r,4)})).filter(x=>x.name);for(const x of chosen){const p=places.find(p=>p.area===x.area&&p.name===x.name);if(p&&!today.includes(p.id))today.push(p.id)}
return {places,history,staff,settings,today,todayStaff:{}};}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX){status('Excel読み込みライブラリを取得できません。ネット接続を確認してください');return}try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const parsed=parseBook(wb);if(!parsed.places.length)throw Error('営業先が見つかりません');if(db.places.length&&!confirm('現在の端末データをExcelの内容で置き換えます。続けますか？'))return;db=parsed;selectedStaff='';try{sessionStorage.removeItem(STAFF_KEY)}catch(e){}persist();render();status(`${db.places.length}件の営業先を読み込みました。保存先はこの端末のみです`)}catch(err){status('読み込みエラー：'+err.message)}e.target.value=''});
$('save').onclick=persist;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='営業ルート_非公開バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('バックアップを保存しました。個人情報を含むため厳重に保管してください')};
$('import').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!validDb(data))throw Error('形式が正しくありません');if(!confirm('現在のデータをバックアップで置き換えますか？'))return;db=data;selectedStaff='';try{sessionStorage.removeItem(STAFF_KEY)}catch(e){}persist();render()}catch(err){status('復元エラー：'+err.message)}e.target.value=''};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function toggle(id){const i=db.today.indexOf(id);if(i<0)db.today.push(id);else {db.today.splice(i,1);delete assignments()[id]}persist();render()}
function staffPicker(){return `<div class="toolbar"><label for="visitor" style="align-self:center;font-weight:600">訪問者（職員）</label><select id="visitor"><option value="">訪問者を選択してください</option>${db.staff.map(n=>`<option value="${safe(n)}" ${n===selectedStaff?'selected':''}>${safe(n)}</option>`).join('')}</select></div>${db.staff.length?'':'<p class="muted">職員が表示されない場合は「集計・設定」で職員名を登録するか、職員名簿のあるExcelを読み込んでください。</p>'}`}
// 主担当者1名と同行者（任意・複数名）を営業先ごとに保存する。
function visitTeam(id){const raw=assignments()[id];if(Array.isArray(raw))return {lead:raw[0]||'',companions:raw.slice(1,5)};return raw&&typeof raw==='object'?{lead:raw.lead||'',companions:Array.isArray(raw.companions)?raw.companions.slice(0,4):[]}: {lead:'',companions:[]}}
function updateTeam(id,part,value){const t=visitTeam(id);if(part==='lead'){t.lead=value;t.companions=t.companions.filter(n=>n!==value)}else{const i=Number(part);t.companions[i]=value;t.companions=t.companions.slice(0,4)}const used=new Set();t.companions=t.companions.map(n=>{if(!n||n===t.lead||used.has(n))return '';used.add(n);return n});assignments()[id]=t;persist();render()}
function visit(id){const p=db.places.find(x=>x.id===id);if(!p)return;const t=visitTeam(id);if(!db.staff.includes(t.lead)){alert('主担当の訪問者を選択してください');return}const companions=[...new Set(t.companions.filter(n=>db.staff.includes(n)&&n!==t.lead))];const memo=prompt(`${p.name}\n訪問メモ（空欄でも可）`);if(memo===null)return;const date=new Date();const dateStr=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');p.visits=(Number(p.visits)||0)+1;p.last=dateStr;db.history.unshift({date:dateStr,area:p.area,type:p.type,name:p.name,staff:t.lead,companions:[...companions],visitors:[t.lead,...companions],memo,time:date.toLocaleTimeString('ja-JP'),count:p.visits});db.today=db.today.filter(x=>x!==id);delete assignments()[id];persist();render()}
function visitorControls(p){const t=visitTeam(p.id);const options=(current,excluded)=>`<option value="">${excluded?'同行者なし':'選択してください'}</option>${db.staff.filter(n=>n===current||!excluded.includes(n)).map(n=>`<option value="${safe(n)}" ${current===n?'selected':''}>${safe(n)}</option>`).join('')}`;return `<div class="visitor-controls"><label for="lead-${safe(p.id)}">訪問者（主担当）</label><select id="lead-${safe(p.id)}" data-lead-place="${safe(p.id)}">${options(t.lead,[])}</select>${[0,1,2,3].map(i=>`<label for="comp-${i}-${safe(p.id)}">同行者${i+1}</label><select id="comp-${i}-${safe(p.id)}" data-companion-place="${safe(p.id)}" data-slot="${i}">${options(t.companions[i]||'',[t.lead,...t.companions.filter((_,j)=>j!==i)].filter(Boolean))}</select>`).join('')}</div>`}
function bindVisitors(root){root.querySelectorAll('[data-lead-place]').forEach(el=>el.onchange=()=>updateTeam(el.dataset.leadPlace,'lead',el.value));root.querySelectorAll('[data-companion-place]').forEach(el=>el.onchange=()=>updateTeam(el.dataset.companionPlace,el.dataset.slot,el.value))}
function mapUrl(p){if(Number.isFinite(p.lat)&&Number.isFinite(p.lng))return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.lat+','+p.lng)}`;return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address||p.name)}`}
function route(){const arr=db.today.map(id=>db.places.find(p=>p.id===id)).filter(Boolean);if(!arr.length){alert('本日の営業先を選択してください');return}const start=db.settings['出発地点住所']||'';const names=[...(start?[start]:[]),...arr.map(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)?`${p.lat},${p.lng}`:p.address||p.name),...(start?[start]:[])];if(names.length<2)return;const origin=names[0],destination=names[names.length-1],waypoints=names.slice(1,-1);const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+(waypoints.length?'&waypoints='+encodeURIComponent(waypoints.join('|')):'')+'&travelmode=driving';if(url.length>1900)alert('訪問先が多いため、Googleマップで全地点を表示できない場合があります。分割してください');window.open(url,'_blank','noopener,noreferrer')}
function item(p,isToday){return `<article class="item"><div><b>${safe(p.name)}</b><div class="muted">${safe(p.area)}｜${safe(p.type)}｜${safe(p.address)}</div><div class="muted">担当：${safe(p.contact||'未登録')}　電話：${safe(p.phone||'未登録')}　訪問回数：${Number(p.visits)||0}</div>${p.memo?`<div class="muted">メモ：${safe(p.memo)}</div>`:''}${isToday?visitorControls(p):''}</div><div class="actions"><button data-toggle="${safe(p.id)}">${isToday?'選択解除':'本日選択'}</button>${isToday?`<button data-visit="${safe(p.id)}" class="primary">訪問済</button>`:''}<a class="btn" href="${safe(mapUrl(p))}" target="_blank" rel="noopener noreferrer">地図</a></div></article>`}
// 検索欄を再生成しないことで、日本語IMEの変換状態とカーソルを維持する。
function filteredPlaces(){return db.places.filter(p=>(district==='すべて'||p.area===district)&&String(p.name||'').toLowerCase().includes(query.toLowerCase()))}
function updateSearchResults(){
  const ps=filteredPlaces(), results=$('results');
  if(!results)return;
  $('searchCount').textContent=String(ps.length);
  results.innerHTML=ps.slice(0,150).map(p=>item(p,db.today.includes(p.id))).join('')||'<p>該当する営業先はありません。</p>';
  $('resultLimit').hidden=ps.length<=150;
  results.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));
  results.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visit(b.dataset.visit));bindVisitors(results);
}
function deleteHistory(index){const h=db.history[index];if(!h)return;if(!confirm(`訪問履歴を1件削除しますか？\n${h.date||''}　${h.name||''}\nこの操作は取り消せません。`))return;db.history.splice(index,1);persist();render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const c=$('content');if(tab==='list'){
  c.innerHTML=`<h2>営業先検索（<span id="searchCount">0</span>件）</h2><div class="filters"><input type="search" id="search" lang="ja" autocomplete="off" placeholder="営業先名で検索" value="${safe(query)}"><select id="district">${['すべて',...districts].map(x=>`<option ${x===district?'selected':''}>${x}</option>`).join('')}</select></div>${staffPicker()}<div id="results"></div><p id="resultLimit" class="muted" hidden>先頭150件を表示しています。検索で絞り込んでください。</p>`;
  const search=$('search');let composing=false;
  search.addEventListener('compositionstart',()=>{composing=true});
  search.addEventListener('compositionend',e=>{composing=false;query=e.target.value;updateSearchResults()});
  search.addEventListener('input',e=>{if(composing||e.isComposing)return;query=e.target.value;updateSearchResults()});
  $('district').addEventListener('change',e=>{district=e.target.value;updateSearchResults()});
  updateSearchResults();
}
else if(tab==='today'){const ps=db.today.map(id=>db.places.find(p=>p.id===id)).filter(Boolean);c.innerHTML=`<h2>本日の営業先（${ps.length}件）</h2><p class="muted">営業先ごとに主担当者を1人選び、同行者は必要に応じて最大4人まで選択してください。</p><div class="toolbar"><button id="route" class="primary">Googleマップでルートを開く</button></div><p class="muted">表示順で経由地を指定します。自動最短経路計算は未対応です。Googleマップ側の経由地数制限にご注意ください。</p>${ps.map(p=>item(p,true)).join('')||'<p>営業先検索から訪問先を選択してください。</p>'}`;$('route').onclick=route}
else if(tab==='history'){c.innerHTML=`<h2>訪問履歴（${db.history.length}件）</h2><p class="muted">不要なテスト履歴は1件ずつ削除できます。削除前に確認画面が表示されます。</p>${db.history.slice(0,200).map((h,i)=>`<article class="item"><div><b>${safe(h.date)}｜${safe(h.name)}</b><div class="muted">${safe(h.area)}　訪問者：${safe(h.staff||"未記録")}　${Array.isArray(h.companions)&&h.companions.length?`同行者：${safe(h.companions.join("・"))}`:""}</div><div>${safe(h.memo)}</div></div><div class="actions"><button type="button" data-delete-history="${i}">この履歴を削除</button></div></article>`).join('')||'<p>履歴はありません。</p>'}${db.history.length>200?'<p>最新200件を表示しています。</p>':''}`}
else{const counts=districts.map(a=>({area:a,n:db.places.filter(p=>p.area===a).length}));c.innerHTML=`<h2>集計・設定</h2>${counts.map(x=>`<p>${safe(x.area)}：${x.n}件</p>`).join('')}<p>営業先総数：${db.places.length}件 ／ 訪問履歴：${db.history.length}件</p><h3>営業先の追加・編集</h3><p class="muted">登録・変更した情報はこの端末にのみ保存されます。</p><input type="hidden" id="editPlaceId"><div class="edit-grid"><label>区<select id="placeArea">${districts.map(d=>`<option>${d}</option>`).join('')}</select></label><label>種別<input id="placeType" placeholder="居宅・病院など"></label><label>営業先名（必須）<input id="placeName" lang="ja"></label><label>住所<input id="placeAddress" lang="ja"></label><label>担当者<input id="placeContact" lang="ja"></label><label>電話番号<input id="placePhone" type="tel"></label><label>緯度（任意）<input id="placeLat" inputmode="decimal"></label><label>経度（任意）<input id="placeLng" inputmode="decimal"></label><label>メモ<input id="placeMemo" lang="ja"></label></div><div class="toolbar"><button class="primary" id="savePlace">営業先を登録・更新</button><button id="clearPlace">入力をクリア</button></div><h3>営業先を編集する</h3><div class="filters"><input id="manageSearch" placeholder="営業先名で絞り込み" lang="ja"></div><div id="managePlaces"></div><h3>職員名簿の管理（${db.staff.length}名）</h3><div class="toolbar"><input id="newStaff" placeholder="職員名を入力" lang="ja"><button id="addStaff">職員を追加</button></div><div id="staffList">${db.staff.map((n,i)=>`<div class="manage-row"><span>${safe(n)}</span><span><button data-edit-staff="${i}">名前を変更</button> <button data-delete-staff="${i}">削除</button></span></div>`).join('')}</div><h3>出発地点</h3><p>${safe(db.settings['出発地点住所']||'未設定')}</p><p class="muted">端末間同期・ログイン・暗号化は未対応です。Excel・バックアップJSONをGitHubにアップロードしないでください。</p>`;
const clear=()=>{['editPlaceId','placeType','placeName','placeAddress','placeContact','placePhone','placeLat','placeLng','placeMemo'].forEach(id=>$(id).value='');$('placeArea').value=districts[0]};
$('clearPlace').onclick=clear;
$('savePlace').onclick=()=>{const name=$('placeName').value.trim();if(!name)return alert('営業先名を入力してください');const id=$('editPlaceId').value;const old=db.places.find(p=>p.id===id);const n=(v)=>{const t=$(v).value.trim();return t===''?NaN:Number(t)};const p={...(old||{}),id:old?.id||'custom-'+(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),area:$('placeArea').value,type:$('placeType').value.trim(),name,address:$('placeAddress').value.trim(),contact:$('placeContact').value.trim(),phone:$('placePhone').value.trim(),lat:n('placeLat'),lng:n('placeLng'),memo:$('placeMemo').value.trim(),visits:old?.visits||0,last:old?.last||''};if(old)Object.assign(old,p);else db.places.push(p);persist();render();alert(old?'営業先を更新しました':'営業先を追加しました')};
const showPlaces=()=>{const q=$('manageSearch').value.toLowerCase();const ps=db.places.filter(p=>p.name.toLowerCase().includes(q));$('managePlaces').innerHTML=ps.slice(0,80).map(p=>`<div class="manage-row"><span>${safe(p.name)}（${safe(p.area)}）</span><span><button data-edit-place="${safe(p.id)}">編集</button> <button data-delete-place="${safe(p.id)}">削除</button></span></div>`).join('')+(ps.length>80?'<p class="muted">先頭80件を表示しています。名前で絞り込んでください。</p>':'');$('managePlaces').querySelectorAll('[data-edit-place]').forEach(b=>b.onclick=()=>{const p=db.places.find(x=>x.id===b.dataset.editPlace);if(!p)return;$('editPlaceId').value=p.id;for(const [key,val] of Object.entries({placeArea:p.area,placeType:p.type,placeName:p.name,placeAddress:p.address,placeContact:p.contact,placePhone:p.phone,placeLat:p.lat,placeLng:p.lng,placeMemo:p.memo}))$(key).value=val==null||typeof val==='number'&&!Number.isFinite(val)?'':val;$('savePlace').scrollIntoView({block:'center',behavior:'smooth'})});$('managePlaces').querySelectorAll('[data-delete-place]').forEach(b=>b.onclick=()=>{const p=db.places.find(x=>x.id===b.dataset.deletePlace);if(!p||!confirm(`「${p.name}」を削除しますか？ 訪問履歴は残ります。`))return;db.places=db.places.filter(x=>x.id!==p.id);db.today=db.today.filter(id=>id!==p.id);delete assignments()[p.id];persist();render()})};$('manageSearch').addEventListener('input',showPlaces);showPlaces();
$('staffList').querySelectorAll('[data-edit-staff]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.editStaff),old=db.staff[i],n=prompt('変更後の職員名',old)?.trim();if(!n||n===old)return;if(db.staff.includes(n))return alert('同じ名前が登録されています');db.staff[i]=n;for(const t of Object.values(assignments())){if(Array.isArray(t)){for(let j=0;j<t.length;j++)if(t[j]===old)t[j]=n}else if(t&&typeof t==='object'){if(t.lead===old)t.lead=n;if(Array.isArray(t.companions))t.companions=t.companions.map(x=>x===old?n:x)}}if(selectedStaff===old)selectedStaff=n;persist();render()});
$('staffList').querySelectorAll('[data-delete-staff]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.deleteStaff),n=db.staff[i];if(!confirm(`「${n}」を職員名簿から削除しますか？ 過去の履歴は残ります。`))return;db.staff.splice(i,1);for(const t of Object.values(assignments())){if(Array.isArray(t)){const j=t.indexOf(n);if(j>=0)t.splice(j,1)}else if(t&&typeof t==='object'){if(t.lead===n)t.lead='';if(Array.isArray(t.companions))t.companions=t.companions.filter(x=>x!==n)}}if(selectedStaff===n)selectedStaff='';persist();render()});}
c.querySelectorAll('[data-delete-history]').forEach(b=>b.onclick=()=>deleteHistory(Number(b.dataset.deleteHistory)));if($('visitor'))$('visitor').addEventListener('change',e=>{selectedStaff=db.staff.includes(e.target.value)?e.target.value:'';try{sessionStorage.setItem(STAFF_KEY,selectedStaff)}catch(err){}});if($('addStaff'))$('addStaff').onclick=()=>{const n=$('newStaff').value.trim();if(!n)return alert('職員名を入力してください');if(!db.staff.includes(n))db.staff.push(n);selectedStaff=n;try{sessionStorage.setItem(STAFF_KEY,n)}catch(err){}persist();render()};c.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));c.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visit(b.dataset.visit));bindVisitors(c)}
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(validDb(parsed)){db=parsed;if(!db.staff.includes(selectedStaff))selectedStaff='';assignments();status(`${db.places.length}件の端末保存データを復元しました`)}}}catch(e){status('保存データを復元できませんでした')}render();
</script></body></html>
